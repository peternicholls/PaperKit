name: Validate Agent Metadata

on:
  push:
    branches: [master]
    paths:
      - ".paperkit/_cfg/agents/**"
      - ".paperkit/_cfg/skills/**"
      - ".paperkit/_cfg/workflows/**"
      - ".paperkit/_cfg/schemas/agent-schema.json"
      - ".paperkit/_cfg/schemas/skill-frontmatter-schema.json"
      - ".paperkit/_cfg/schemas/workflow-schema.json"
      - ".paperkit/_cfg/agent-manifest.yaml"
      - ".paperkit/_cfg/workflow-manifest.yaml"
      - ".paperkit/tools/validate-agent-schema.py"
      - ".paperkit/tools/validate-skill-frontmatter.py"
      - ".paperkit/tools/validate-workflow-schema.py"
      - ".paperkit/tools/check-agents.py"
      - ".paperkit/core/agents/**"
      - ".paperkit/specialist/agents/**"
  pull_request:
    branches: [master]
    paths:
      - ".paperkit/_cfg/agents/**"
      - ".paperkit/_cfg/skills/**"
      - ".paperkit/_cfg/workflows/**"
      - ".paperkit/_cfg/schemas/agent-schema.json"
      - ".paperkit/_cfg/schemas/skill-frontmatter-schema.json"
      - ".paperkit/_cfg/schemas/workflow-schema.json"
      - ".paperkit/_cfg/agent-manifest.yaml"
      - ".paperkit/_cfg/workflow-manifest.yaml"
      - ".paperkit/tools/validate-agent-schema.py"
      - ".paperkit/tools/validate-skill-frontmatter.py"
      - ".paperkit/tools/validate-workflow-schema.py"
      - ".paperkit/tools/check-agents.py"
      - ".paperkit/core/agents/**"
      - ".paperkit/specialist/agents/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-agents:
    name: Validate Agent Definitions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate agent schemas
        run: |
          python .paperkit/tools/validate-agent-schema.py --ci \
            --schema .paperkit/_cfg/schemas/agent-schema.json \
            --agents-dir .paperkit/_cfg/agents

      - name: Validate Agent Skills (SKILL.md)
        run: |
          python .paperkit/tools/validate-skill-frontmatter.py --all --ci

      - name: Validate Compositional Workflows (FR-016, FR-013, FR-017)
        run: |
          python .paperkit/tools/validate-workflow-schema.py --ci

      - name: Run unified agent system check
        run: |
          python .paperkit/tools/check-agents.py --ci
