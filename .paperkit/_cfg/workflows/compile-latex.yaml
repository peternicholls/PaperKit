# Compile LaTeX Skill
# Atomic skill: Compile LaTeX document to PDF
#
# This skill wraps the build-latex tool to compile
# the main document with proper bibliography processing

name: compile-latex
displayName: Compile LaTeX
description: Compile LaTeX document to PDF
version: 1.0.0
type: atomic

prerequisites:
  - type: tool
    name: build-latex

steps:
  - action: compile-document
    agent: latex-assembler
    inputs:
      - main_file
      - output_dir
      - clean_build
    outputs:
      - pdf_path
      - build_log
      - errors
      - warnings
    onError: fail
    tool: build-latex

inputSchema:
  type: object
  properties:
    main_file:
      type: string
      description: Path to main .tex file
      default: latex/main.tex
    output_dir:
      type: string
      description: Output directory for PDF
      default: latex/
    clean_build:
      type: boolean
      description: Whether to clean auxiliary files before build
      default: false
    bibliography:
      type: boolean
      description: Whether to process bibliography
      default: true
  required: []

outputSchema:
  type: object
  properties:
    pdf_path:
      type: string
      description: Path to generated PDF
    build_log:
      type: string
      description: Full build log output
    success:
      type: boolean
      description: Whether compilation succeeded
    errors:
      type: array
      description: List of compilation errors
      items:
        type: object
        properties:
          file:
            type: string
          line:
            type: integer
          message:
            type: string
    warnings:
      type: array
      description: List of compilation warnings
      items:
        type: object
        properties:
          file:
            type: string
          line:
            type: integer
          message:
            type: string
  required:
    - success

timeout: 120000

retryPolicy:
  maxRetries: 1
  backoffMs: 1000
  retryableErrors:
    - temporary_file_lock

metadata:
  author: core-team
  tags:
    - latex
    - compilation
    - pdf
  category: build
