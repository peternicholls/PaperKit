# Review Draft Workflow Definition
# Part of PaperKit Specialist Workflows

name: review-draft
displayName: Review Draft
description: Tutor feedback on draft quality
version: "1.0.0"
type: composite

metadata:
  author: specialist-team
  category: tutor
  tags:
    - review
    - feedback
    - tutoring

steps:
  - action: read-draft
    agent: tutor
    inputs:
      - content
    outputs:
      - draftUnderstanding

  - action: assess-quality
    agent: tutor
    skill: structured-reviewing
    inputs:
      - draftUnderstanding
      - level
    outputs:
      - qualityAssessment

  - action: identify-issues
    agent: tutor
    skill: structured-reviewing
    inputs:
      - qualityAssessment
      - focusAreas
    outputs:
      - issues
      - strengths

  - action: provide-feedback
    agent: tutor
    inputs:
      - qualityAssessment
      - issues
      - strengths
    outputs:
      - overallAssessment
      - improvements
      - grade

inputSchema:
  type: object
  required:
    - content
  properties:
    content:
      type: string
      description: Draft content to review
    focusAreas:
      type: array
      description: Specific areas to focus feedback on
      items:
        type: string
      default: []
    level:
      type: string
      description: Level of detail for feedback
      enum:
        - high-level
        - detailed
        - comprehensive
      default: detailed

outputSchema:
  type: object
  properties:
    overallAssessment:
      type: string
      description: High-level quality assessment
    strengths:
      type: array
      description: Identified strengths
      items:
        type: string
    improvements:
      type: array
      description: Suggested improvements
      items:
        type: object
        properties:
          area:
            type: string
          suggestion:
            type: string
          priority:
            type: string
    grade:
      type: string
      description: Quality grade (A-F)
