# Write Section Workflow Definition
# Part of PaperKit Core Workflows

name: write-section
displayName: Write Section
description: Draft a complete section with academic rigor
version: "1.0.0"
type: composite

metadata:
  author: core-team
  category: drafting
  tags:
    - drafting
    - writing
    - sections

steps:
  - action: understand-context
    agent: section-drafter
    inputs:
      - sectionName
      - outline
      - context
    outputs:
      - sectionContext
      - requirements

  - action: verify-sources
    agent: section-drafter
    inputs:
      - citations
      - sectionContext
    outputs:
      - verifiedSources

  - action: draft-content
    agent: section-drafter
    skill: section-writing
    inputs:
      - sectionContext
      - requirements
      - verifiedSources
    outputs:
      - draftContent

  - action: add-citations
    agent: section-drafter
    skill: harvard-citations
    inputs:
      - draftContent
      - verifiedSources
    outputs:
      - citedContent
      - usedCitations

  - action: review-quality
    agent: section-drafter
    skill: academic-writing
    inputs:
      - citedContent
    outputs:
      - content
      - citations
      - wordCount

inputSchema:
  type: object
  required:
    - sectionName
  properties:
    sectionName:
      type: string
      description: Name of section to write
    outline:
      type: string
      description: Section outline or key points
    context:
      type: string
      description: Context from previous sections
    citations:
      type: array
      description: Available citations to use
      items:
        type: string
      default: []

outputSchema:
  type: object
  properties:
    content:
      type: string
      description: Drafted section content in LaTeX
    citations:
      type: array
      description: Citations used in section
      items:
        type: string
    wordCount:
      type: integer
      description: Approximate word count
