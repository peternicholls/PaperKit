# Citation Completeness Workflow Definition
# Part of PaperKit Core Workflows

name: citation-completeness
displayName: Check Citation Completeness
description: >
  Verify all BibTeX entries have complete information for their type.
  Checks required and recommended fields per entry type according
  to Harvard style requirements.
version: "1.0.0"
type: composite

metadata:
  author: core-team
  category: references
  tags:
    - citations
    - validation
    - completeness

steps:
  - action: load-rules
    agent: reference-manager
    skill: bibtex-management
    inputs: []
    outputs:
      - citationRules

  - action: parse-bibtex
    agent: reference-manager
    skill: bibtex-management
    inputs:
      - bibFile
      - checkKeys
    outputs:
      - parsedEntries

  - action: check-required-fields
    agent: reference-manager
    inputs:
      - parsedEntries
      - citationRules
    outputs:
      - requiredFieldResults

  - action: check-recommended-fields
    agent: reference-manager
    inputs:
      - parsedEntries
      - citationRules
      - strictMode
    outputs:
      - recommendedFieldResults

  - action: validate-field-format
    agent: reference-manager
    skill: harvard-citations
    inputs:
      - parsedEntries
    outputs:
      - formatValidationResults

  - action: check-online-sources
    agent: reference-manager
    inputs:
      - parsedEntries
    outputs:
      - onlineSourceResults

  - action: generate-report
    agent: reference-manager
    inputs:
      - requiredFieldResults
      - recommendedFieldResults
      - formatValidationResults
      - onlineSourceResults
    outputs:
      - complete
      - entries
      - statistics

inputSchema:
  type: object
  properties:
    bibFile:
      type: string
      description: Path to BibTeX file
      default: latex/references/references.bib
    checkKeys:
      type: array
      description: "Specific citation keys to check (default: all)"
      items:
        type: string
      default: []
    strictMode:
      type: boolean
      description: Include recommended fields in error count
      default: false

outputSchema:
  type: object
  properties:
    complete:
      type: boolean
      description: Whether all entries are complete
    entries:
      type: array
      description: Status of each entry
      items:
        type: object
        properties:
          key:
            type: string
          type:
            type: string
          status:
            type: string
            enum:
              - complete
              - incomplete
              - warnings
          missingRequired:
            type: array
            items:
              type: string
          missingRecommended:
            type: array
            items:
              type: string
          formatIssues:
            type: array
            items:
              type: string
    statistics:
      type: object
      properties:
        totalEntries:
          type: integer
        completeEntries:
          type: integer
        incompleteEntries:
          type: integer
        completionRate:
          type: number
