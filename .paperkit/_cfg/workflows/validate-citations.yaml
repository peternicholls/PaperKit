# Validate Citations Workflow Definition
# Part of PaperKit Core Workflows
# Enhanced citation validation with Harvard style checking

name: validate-citations
displayName: Validate Citations
description: >
  Comprehensive citation validation against BibTeX database.
  Ensures academic integrity through proper attribution and referencing.
  Checks for missing entries, incomplete fields, orphaned references,
  Harvard style compliance, and proper page numbers for all quotes.
version: "1.0.0"
type: conditional

metadata:
  author: core-team
  category: references
  tags:
    - validation
    - citations
    - harvard

steps:
  - action: load-rules
    agent: reference-manager
    skill: harvard-citations
    inputs: []
    outputs:
      - validationRules

  - action: scan-citations
    agent: reference-manager
    inputs:
      - texFiles
    outputs:
      - scannedCitations

  - action: parse-bibtex
    agent: reference-manager
    skill: bibtex-management
    inputs:
      - bibFile
    outputs:
      - bibEntries

  - action: match-citations
    agent: reference-manager
    inputs:
      - scannedCitations
      - bibEntries
    outputs:
      - matchResults
      - missingEntries
      - orphanedEntries

  - action: validate-completeness
    agent: reference-manager
    inputs:
      - bibEntries
      - validationRules
    outputs:
      - completenessResults

  - action: check-format
    agent: reference-manager
    skill: harvard-citations
    inputs:
      - bibEntries
      - strictMode
    outputs:
      - formatResults

  - action: auto-fix
    agent: reference-manager
    condition: "autoFix === true"
    inputs:
      - formatResults
      - bibFile
    outputs:
      - fixedEntries
    onError: skip

  - action: generate-report
    agent: reference-manager
    inputs:
      - matchResults
      - completenessResults
      - formatResults
      - outputFormat
    outputs:
      - success
      - statistics
      - errors
      - warnings
      - info
      - reportPath

inputSchema:
  type: object
  properties:
    texFiles:
      type: array
      description: "List of LaTeX files to scan (default: all in latex/sections/)"
      items:
        type: string
      default: []
    bibFile:
      type: string
      description: Path to BibTeX file
      default: latex/references/references.bib
    strictMode:
      type: boolean
      description: Treat warnings as errors
      default: false
    autoFix:
      type: boolean
      description: Automatically fix simple formatting issues
      default: false
    outputFormat:
      type: string
      description: Report format
      enum:
        - markdown
        - yaml
        - json
      default: markdown

outputSchema:
  type: object
  properties:
    success:
      type: boolean
      description: Whether validation passed (no errors)
    statistics:
      type: object
      properties:
        totalCitations:
          type: integer
        uniqueCitations:
          type: integer
        bibEntries:
          type: integer
        matchRate:
          type: number
        errorCount:
          type: integer
        warningCount:
          type: integer
    errors:
      type: array
      description: Critical issues that must be fixed
      items:
        type: object
        properties:
          id:
            type: string
          type:
            type: string
          key:
            type: string
          message:
            type: string
          location:
            type: string
          fix:
            type: string
    warnings:
      type: array
      description: Issues that should be addressed
      items:
        type: object
    info:
      type: array
      description: Suggestions for improvement
      items:
        type: object
    reportPath:
      type: string
      description: Path to generated validation report
