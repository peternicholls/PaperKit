# Generate Skeleton Workflow Definition
# Part of PaperKit Core Workflows

name: skeleton
displayName: Generate Skeleton
description: Create LaTeX skeleton files for sections
version: "1.0.0"
type: composite

metadata:
  author: core-team
  category: planning
  tags:
    - planning
    - skeleton
    - latex

steps:
  - action: parse-outline
    agent: paper-architect
    inputs:
      - outline
    outputs:
      - parsedSections

  - action: create-files
    agent: latex-assembler
    skill: latex-best-practices
    inputs:
      - parsedSections
      - sections
    outputs:
      - createdFiles

  - action: setup-structure
    agent: latex-assembler
    inputs:
      - createdFiles
    outputs:
      - mainTex
      - files

  - action: validate-skeleton
    agent: latex-assembler
    inputs:
      - mainTex
    outputs:
      - success

inputSchema:
  type: object
  properties:
    outline:
      type: string
      description: Paper outline from outline workflow
    sections:
      type: array
      description: List of section names
      items:
        type: string
      default: []

outputSchema:
  type: object
  properties:
    files:
      type: array
      description: List of generated LaTeX files
      items:
        type: string
    mainTex:
      type: string
      description: Path to main.tex file
    success:
      type: boolean
      description: Whether skeleton was created successfully
