# Format Bibliography Workflow Definition
# Part of PaperKit Core Workflows

name: format-bibliography
displayName: Format Bibliography
description: >
  Generate a properly formatted bibliography from BibTeX database.
  Applies Harvard style (Cite Them Right) formatting rules.
version: "1.0.0"
type: composite

metadata:
  author: core-team
  category: references
  tags:
    - bibliography
    - formatting
    - harvard

steps:
  - action: load-guide
    agent: reference-manager
    skill: harvard-citations
    inputs: []
    outputs:
      - styleGuide

  - action: parse-bibtex
    agent: reference-manager
    skill: bibtex-management
    inputs:
      - bibFile
    outputs:
      - parsedEntries

  - action: sort-entries
    agent: reference-manager
    inputs:
      - parsedEntries
    outputs:
      - sortedEntries

  - action: format-entries
    agent: reference-manager
    skill: harvard-citations
    inputs:
      - sortedEntries
      - styleGuide
      - includeKeys
      - excludeUnused
    outputs:
      - formattedEntries

  - action: generate-bibliography
    agent: reference-manager
    inputs:
      - formattedEntries
      - outputFormat
    outputs:
      - bibliography
      - entryCount

  - action: output-formats
    agent: reference-manager
    inputs:
      - bibliography
      - outputFormat
    outputs:
      - outputPath

inputSchema:
  type: object
  properties:
    bibFile:
      type: string
      description: Path to BibTeX file
      default: latex/references/references.bib
    outputFormat:
      type: string
      description: Output format for bibliography
      enum:
        - markdown
        - latex
        - text
      default: markdown
    includeKeys:
      type: array
      description: Only include these citation keys (default all)
      items:
        type: string
      default: []
    excludeUnused:
      type: boolean
      description: Exclude entries not cited in document
      default: false

outputSchema:
  type: object
  properties:
    bibliography:
      type: string
      description: Formatted bibliography content
    entryCount:
      type: integer
      description: Number of entries in bibliography
    outputPath:
      type: string
      description: Path where bibliography was saved
