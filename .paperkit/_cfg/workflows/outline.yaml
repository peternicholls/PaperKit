# Create Outline Workflow Definition
# Part of PaperKit Core Workflows

name: outline
displayName: Create Outline
description: Design paper structure and create detailed outline
version: "1.0.0"
type: composite

metadata:
  author: core-team
  category: planning
  tags:
    - planning
    - structure
    - architecture

steps:
  - action: analyze-topic
    agent: paper-architect
    inputs:
      - topic
      - scope
    outputs:
      - topicAnalysis

  - action: design-structure
    agent: paper-architect
    inputs:
      - topicAnalysis
      - targetLength
    outputs:
      - structureDesign

  - action: create-outline
    agent: paper-architect
    inputs:
      - structureDesign
    outputs:
      - outline
      - sections

  - action: validate-flow
    agent: paper-architect
    inputs:
      - outline
      - sections
    outputs:
      - validatedOutline
      - flowReport

inputSchema:
  type: object
  required:
    - topic
  properties:
    topic:
      type: string
      description: Paper topic or research question
    scope:
      type: string
      description: Scope and boundaries of the paper
    targetLength:
      type: integer
      description: Target paper length in pages
      default: 20

outputSchema:
  type: object
  properties:
    outline:
      type: string
      description: Detailed paper outline
    sections:
      type: array
      description: List of section names and descriptions
      items:
        type: object
        properties:
          name:
            type: string
          description:
            type: string
    validatedOutline:
      type: string
      description: Final validated outline
    flowReport:
      type: object
      description: Validation report for logical flow
