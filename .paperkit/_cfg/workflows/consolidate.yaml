# Consolidate Research Workflow Definition
# Part of PaperKit Core Workflows

name: consolidate
displayName: Consolidate Research
description: Synthesize research materials into coherent reference documents
version: "1.0.0"
type: composite

metadata:
  author: core-team
  category: research
  tags:
    - research
    - synthesis
    - consolidation

steps:
  - action: gather-sources
    agent: research-consolidator
    inputs:
      - topic
      - sources
    outputs:
      - organizedSources
      - sourceInventory

  - action: synthesize
    agent: research-consolidator
    skill: research-synthesis
    inputs:
      - organizedSources
      - depth
    outputs:
      - synthesizedDocument

  - action: cite-sources
    agent: research-consolidator
    skill: harvard-citations
    inputs:
      - synthesizedDocument
      - sourceInventory
    outputs:
      - citedDocument
      - citations

  - action: identify-gaps
    agent: research-consolidator
    skill: research-synthesis
    inputs:
      - citedDocument
      - sourceInventory
    outputs:
      - document
      - gaps

inputSchema:
  type: object
  required:
    - topic
  properties:
    topic:
      type: string
      description: Research topic or question
    sources:
      type: array
      description: List of research materials
      items:
        type: object
      default: []
    depth:
      type: string
      enum:
        - shallow
        - moderate
        - deep
      default: moderate

outputSchema:
  type: object
  properties:
    document:
      type: string
      description: Synthesized research document
    citations:
      type: array
      description: List of citations used
      items:
        type: string
    gaps:
      type: array
      description: Identified research gaps
      items:
        type: object
        properties:
          area:
            type: string
          severity:
            type: string
          suggestion:
            type: string
