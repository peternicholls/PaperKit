# Generate Ideas Workflow Definition
# Part of PaperKit Specialist Workflows

name: generate-ideas
displayName: Generate Ideas
description: Brainstorm ideas on a topic
version: "1.0.0"
type: composite

metadata:
  author: specialist-team
  category: brainstorm
  tags:
    - brainstorm
    - ideas
    - creativity

steps:
  - action: explore-topic
    agent: brainstorm
    skill: brainstorming
    inputs:
      - topic
      - constraints
    outputs:
      - topicExploration

  - action: generate-ideas
    agent: brainstorm
    skill: brainstorming
    inputs:
      - topicExploration
      - quantity
    outputs:
      - rawIdeas

  - action: organize-ideas
    agent: brainstorm
    inputs:
      - rawIdeas
    outputs:
      - organizedIdeas

  - action: prioritize
    agent: brainstorm
    inputs:
      - organizedIdeas
      - constraints
    outputs:
      - ideas

inputSchema:
  type: object
  required:
    - topic
  properties:
    topic:
      type: string
      description: Topic to brainstorm about
    constraints:
      type: array
      description: Any constraints or requirements
      items:
        type: string
      default: []
    quantity:
      type: integer
      description: Number of ideas to generate
      default: 10

outputSchema:
  type: object
  properties:
    ideas:
      type: array
      description: List of generated ideas
      items:
        type: object
        properties:
          idea:
            type: string
          category:
            type: string
          priority:
            type: string
            enum:
              - high
              - medium
              - low
