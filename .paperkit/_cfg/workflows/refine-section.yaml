# Refine Section Workflow Definition
# Part of PaperKit Core Workflows

name: refine-section
displayName: Refine Section
description: Improve draft quality through iterative refinement
version: "1.0.0"
type: composite

metadata:
  author: core-team
  category: refinement
  tags:
    - refinement
    - quality
    - editing

steps:
  - action: analyze-draft
    agent: quality-refiner
    skill: text-refinement
    inputs:
      - sectionName
      - content
    outputs:
      - analysisReport
      - improvementAreas

  - action: improve-clarity
    agent: quality-refiner
    skill: text-refinement
    inputs:
      - content
      - improvementAreas
    outputs:
      - clarifiedContent

  - action: strengthen-flow
    agent: quality-refiner
    skill: text-refinement
    inputs:
      - clarifiedContent
      - focusAreas
    outputs:
      - flowImprovedContent

  - action: polish-language
    agent: quality-refiner
    skill: academic-writing
    inputs:
      - flowImprovedContent
    outputs:
      - refinedContent
      - changes
      - suggestions

inputSchema:
  type: object
  required:
    - sectionName
    - content
  properties:
    sectionName:
      type: string
      description: Name of section to refine
    content:
      type: string
      description: Current draft content
    focusAreas:
      type: array
      description: Specific areas to focus on
      items:
        type: string
      default: []

outputSchema:
  type: object
  properties:
    refinedContent:
      type: string
      description: Improved section content
    changes:
      type: array
      description: List of improvements made
      items:
        type: string
    suggestions:
      type: array
      description: Further improvement suggestions
      items:
        type: string
