# Lock Chapter Workflow Definition
# Part of PaperKit Core Workflows

name: lock-chapter
displayName: Lock Chapter
description: Sign off and lock a chapter or section from further conceptual edits
version: "1.0.0"
type: composite

metadata:
  author: core-team
  category: assembly
  tags:
    - assembly
    - locking
    - versioning

steps:
  - action: pre-lock-validation
    agent: paper-architect
    inputs:
      - target
      - targetType
      - filePaths
    outputs:
      - validationResults
      - validationPassed

  - action: create-git-commit
    agent: latex-assembler
    inputs:
      - target
      - title
      - filePaths
    outputs:
      - commitHash

  - action: create-annotated-tag
    agent: latex-assembler
    inputs:
      - target
      - versionMajor
      - versionMinor
      - commitHash
    outputs:
      - tag

  - action: create-snapshot
    agent: latex-assembler
    inputs:
      - target
      - tag
    outputs:
      - snapshotPath

  - action: update-documentation
    agent: paper-architect
    inputs:
      - target
      - targetType
      - title
      - tag
      - snapshotPath
    outputs:
      - summaryPath
      - success

inputSchema:
  type: object
  required:
    - target
    - targetType
  properties:
    target:
      type: string
      description: What to lock (e.g., "ch2", "frontmatter", "ch3")
    targetType:
      type: string
      description: Type of content being locked
      enum:
        - chapter
        - frontmatter
        - appendix
        - section
    title:
      type: string
      description: Human-readable title of locked content
    versionMajor:
      type: number
      description: Major version number
      default: 0
    versionMinor:
      type: number
      description: Minor version number (auto-incremented)
    filePaths:
      type: array
      description: Files being locked
      items:
        type: string
      default: []

outputSchema:
  type: object
  properties:
    tag:
      type: string
      description: Git tag created
    snapshotPath:
      type: string
      description: Path to PDF snapshot
    summaryPath:
      type: string
      description: Path to lock summary document
    success:
      type: boolean
      description: Whether lock succeeded
