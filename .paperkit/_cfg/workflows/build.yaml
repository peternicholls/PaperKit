# Build Document Workflow Definition
# Part of PaperKit Core Workflows

name: build
displayName: Build Document
description: Compile LaTeX document to PDF
version: "1.0.0"
type: composite

metadata:
  author: core-team
  category: assembly
  tags:
    - assembly
    - compilation
    - pdf

steps:
  - action: validate-structure
    agent: latex-assembler
    inputs:
      - mainTex
    outputs:
      - structureValid
      - missingFiles

  - action: compile-latex
    agent: latex-assembler
    inputs:
      - mainTex
    outputs:
      - firstPassResult

  - action: process-bibliography
    agent: latex-assembler
    inputs:
      - mainTex
    outputs:
      - bibResult

  - action: final-compile
    agent: latex-assembler
    inputs:
      - mainTex
      - outputDir
    outputs:
      - pdfPath
      - success
      - errors

inputSchema:
  type: object
  properties:
    mainTex:
      type: string
      description: Path to main LaTeX file
      default: latex/main.tex
    outputDir:
      type: string
      description: Directory for output files
      default: .paperkit/data/output-final/pdf/

outputSchema:
  type: object
  properties:
    pdfPath:
      type: string
      description: Path to generated PDF
    success:
      type: boolean
      description: Whether compilation succeeded
    errors:
      type: array
      description: Compilation errors if any
      items:
        type: string
