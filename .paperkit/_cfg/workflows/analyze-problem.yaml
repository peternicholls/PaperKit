# Analyze Problem Workflow Definition
# Part of PaperKit Specialist Workflows

name: analyze-problem
displayName: Analyze Problem
description: Root cause analysis and solution options
version: "1.0.0"
type: composite

metadata:
  author: specialist-team
  category: problem-solving
  tags:
    - problem-solving
    - analysis
    - debugging

steps:
  - action: define-problem
    agent: problem-solver
    skill: problem-analysis
    inputs:
      - problem
      - context
    outputs:
      - problemDefinition

  - action: identify-causes
    agent: problem-solver
    skill: problem-analysis
    inputs:
      - problemDefinition
    outputs:
      - rootCauses

  - action: generate-solutions
    agent: problem-solver
    inputs:
      - problemDefinition
      - rootCauses
      - objectives
    outputs:
      - solutions

  - action: evaluate-options
    agent: problem-solver
    inputs:
      - solutions
      - objectives
    outputs:
      - recommendation

inputSchema:
  type: object
  required:
    - problem
  properties:
    problem:
      type: string
      description: Description of the problem
    context:
      type: string
      description: Additional context and constraints
    objectives:
      type: array
      description: Objectives or success criteria
      items:
        type: string
      default: []

outputSchema:
  type: object
  properties:
    rootCauses:
      type: array
      description: Identified root causes
      items:
        type: string
    solutions:
      type: array
      description: Potential solutions
      items:
        type: object
        properties:
          name:
            type: string
          description:
            type: string
          pros:
            type: array
            items:
              type: string
          cons:
            type: array
            items:
              type: string
    recommendation:
      type: string
      description: Recommended approach
