# Search Sources Workflow Definition
# Part of PaperKit Specialist Workflows

name: search-sources
displayName: Search Sources
description: Find research sources on topic
version: "1.0.0"
type: composite

metadata:
  author: specialist-team
  category: librarian
  tags:
    - search
    - sources
    - bibliography

steps:
  - action: clarify-query
    agent: librarian
    inputs:
      - topic
      - filters
    outputs:
      - refinedQuery
      - searchCriteria

  - action: search-databases
    agent: librarian
    inputs:
      - refinedQuery
      - searchCriteria
    outputs:
      - rawResults

  - action: filter-results
    agent: librarian
    inputs:
      - rawResults
      - filters
      - maxResults
    outputs:
      - filteredResults
      - sources

  - action: compile-bibliography
    agent: librarian
    skill: bibtex-management
    inputs:
      - sources
    outputs:
      - bibEntries

inputSchema:
  type: object
  required:
    - topic
  properties:
    topic:
      type: string
      description: Research topic or query
    filters:
      type: object
      description: Search filters (year range, publication type, etc.)
      default: {}
    maxResults:
      type: integer
      description: Maximum number of sources to return
      default: 20

outputSchema:
  type: object
  properties:
    sources:
      type: array
      description: List of found sources
      items:
        type: object
        properties:
          title:
            type: string
          authors:
            type: array
            items:
              type: string
          year:
            type: integer
          citation:
            type: string
    bibEntries:
      type: array
      description: BibTeX entries for sources
      items:
        type: string
