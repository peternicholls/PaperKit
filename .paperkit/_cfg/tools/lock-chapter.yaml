# Lock Chapter Tool Definition
# Part of PaperKit Tool Collection

name: lock-chapter
displayName: Lock Chapter
description: Execute the chapter locking protocol - commit, tag, snapshot, document
path: .paperkit/tools/lock-chapter.sh
requiresConsent: true

capabilities:
  - Create git commit with final chapter state
  - Create annotated git tag marking lock
  - Generate PDF snapshot with timestamp
  - Create or update lock summary documentation
  - Update master lock index

constraints:
  - Requires clean git working directory
  - Requires LaTeX build to succeed
  - Must be run from repository root
  - Requires write permissions

dependencies:
  - git
  - pdflatex (via ./paperkit latex build)
  - mkdir, cp, date (standard shell utilities)

inputSchema:
  type: object
  required:
    - target
    - title
  properties:
    target:
      type: string
      description: Short identifier (ch2, frontmatter, etc.)
    title:
      type: string
      description: Human-readable title
    versionMajor:
      type: number
      description: Major version number
      default: 0
    versionMinor:
      type: number
      description: Minor version number (auto-assigned if not provided)
    targetType:
      type: string
      description: Type of content
      enum: [chapter, frontmatter, appendix, section]
      default: chapter
    filePaths:
      type: array
      description: Files being locked
      items:
        type: string

outputSchema:
  type: object
  properties:
    tag:
      type: string
      description: Git tag created (e.g., paper-v0.2-ch2-signedoff)
    commitHash:
      type: string
      description: Git commit SHA
    snapshotPath:
      type: string
      description: Path to PDF snapshot
    summaryPath:
      type: string
      description: Path to lock summary markdown
    success:
      type: boolean

exampleUsage:
  - "./.paperkit/tools/lock-chapter.sh --target ch2 --title 'Perceptual Foundations'"
  - "./.paperkit/tools/lock-chapter.sh --target frontmatter --title 'Abstract and Metadata'"
  - "./paperkit lock-chapter ch3 'Journey Construction'"

owner: core-team
